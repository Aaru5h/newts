worker_processes 1;
error_log /tmp/cn-nginx-error.log info;
pid /tmp/cn-nginx.pid;

events {
    worker_connections 256;
}

http {
    access_log /tmp/cn-nginx-access.log;

    upstream cn_backends {
        server 10.7.26.162:3001 max_fails=2 fail_timeout=10s;
        server 10.7.13.255:3002 max_fails=2 fail_timeout=10s;
    }

    server {
        listen 8443 ssl;
        server_name app.team1.test api.team1.test;

        ssl_certificate /Users/Deepak/cn-phase1-certs/app.team1.test.pem;
        ssl_certificate_key /Users/Deepak/cn-phase1-certs/app.team1.test-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        add_header X-Edge "mac2-primary" always;

        location / {
            proxy_pass http://cn_backends;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
    }
}
