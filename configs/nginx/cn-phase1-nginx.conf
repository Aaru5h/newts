worker_processes  1;
pid /tmp/cn-phase1-nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log /tmp/cn-phase1-access.log;
    error_log  /tmp/cn-phase1-error.log info;

    upstream phase1_backends {
        server 10.7.14.119:3001 max_fails=1 fail_timeout=5s;
        server 10.7.22.175:3002 max_fails=1 fail_timeout=5s;
    }

    server {
        listen 8443 ssl;
        server_name app.team1.test api.team1.test;

	ssl_certificate     /Users/Deepak/cn-phase1-certs/app.team1.test.pem;
	ssl_certificate_key /Users/Deepak/cn-phase1-certs/app.team1.test-key.pem;
	ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://phase1_backends;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
